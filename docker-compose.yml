version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      DB_USER:   ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST:    ${DB_HOST}
      DB_PORT:    ${DB_PORT}
      DB_NAME:    ${DB_NAME}
      RUN_PORT:   ${RUN_PORT}
    depends_on:
      - db

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: dbname
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: