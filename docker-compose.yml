version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile      
    image: echo-service:dev 
    ports:
      - "8080:8080"
    environment:
      # DB 接続情報など必要な ENV を列挙
      # - DB_HOST=db
      # - DB_PORT=5432
      # - DB_USER=user
      # - DB_PASSWORD=pass
      # - DB_NAME=dbname
    depends_on:
      - db

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: dbname
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: